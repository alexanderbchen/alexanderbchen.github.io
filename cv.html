<link rel="stylesheet" href="style.css" />
<style>
  html, body{ height:100%; overflow:hidden; }

  .pdf-stage{
    height:calc(100vh - var(--nav-h));
    height:calc(100dvh - var(--nav-h));
    background:var(--tint);
    border-top:1px solid var(--rule);
  }
  .pdf-stage object,
  .pdf-stage iframe{ display:block; width:100%; height:100%; border:0; }

  /* Fallback card: shown when the viewport is too small for an embedded
     viewer to be usable, and as <object> fallback content if the browser
     refuses to render the PDF inline. */
  .pdf-fallback{
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:.9rem; padding:2rem 1.4rem; text-align:center;
  }
  .pdf-fallback .eyebrow{
    font-family:var(--mono); font-size:.7rem; letter-spacing:.12em;
    text-transform:uppercase; color:var(--accent); margin:0;
  }
  .pdf-fallback p{ margin:0; color:var(--ink-soft); max-width:26rem; }
  .pdf-btn{
    font-family:var(--mono); font-size:.78rem; letter-spacing:.06em;
    text-decoration:none; color:var(--paper); background:var(--accent);
    padding:.62rem 1.15rem; border-radius:3px;
  }
  .pdf-btn:hover{ background:var(--accent-dk); color:var(--paper); }

  .narrow-only{ display:none; }
  @media (max-width:46rem){
    .pdf-stage object{ display:none; }
    .narrow-only{ display:flex; }
  }
</style>
</head>

</nav>

<main class="pdf-stage">
  <object data="chen-cv.pdf#view=FitH" type="application/pdf" aria-label="Curriculum vitae of Alexander B. Chen">
    <div class="pdf-fallback">
      <p class="eyebrow">Curriculum vitae</p>
      <p>This browser won&rsquo;t display the PDF inline.</p>
      <a class="pdf-btn" href="chen-cv.pdf" target="_blank" rel="noopener">Open chen-cv.pdf</a>
    </div>
  </object>
  <div class="pdf-fallback narrow-only">
    <p class="eyebrow">Curriculum vitae</p>
    <p>Embedded PDF viewers are unreliable on small screens, so here&rsquo;s the file directly.</p>
    <a class="pdf-btn" href="chen-cv.pdf" target="_blank" rel="noopener">Open chen-cv.pdf</a>
  </div>
</main>
